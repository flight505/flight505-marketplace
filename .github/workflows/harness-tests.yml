name: harness tests

on:
  pull_request:
    paths:
      - 'harness/**'
      - '.github/workflows/harness-tests.yml'
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - '.github/workflows/harness-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run harness tests
        run: harness/tests/run.sh
